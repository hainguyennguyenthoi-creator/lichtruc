<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lịch trực</title>
  <meta name="theme-color" content="#0f3d5e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lịch trực">
</head>
<body>
  <div id="app"><div class="center">Đang tải…</div></div>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>
  <script>
    // Luôn tải bản mới nhất của giao diện (tránh bộ nhớ đệm 10 phút của GitHub Pages)
    const v = Date.now();
    document.head.insertAdjacentHTML('beforeend', `<link rel="stylesheet" href="style.css?v=${v}">`);
    import(`./app.js?v=${v}`);
  </script>
</body>
</html>
